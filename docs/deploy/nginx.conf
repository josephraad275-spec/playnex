# PRIVATE STAGING TEMPLATE ONLY: not installed, executed, or syntax-validated here.
# Include this file from nginx's http {} context, never from inside server {}.
# Replace every playnex.example.invalid occurrence, both certificate paths and root.
# Restrict staging ingress to authorized adult testers before enabling this server.
# This template does not grant permission to publish or provision infrastructure.

map $http_upgrade $playnex_connection_upgrade {
    default upgrade;
    '' close;
}

# $request and $request_uri include sensitive WebSocket query credentials.
# Never add them, $args, Referer, Authorization, cookies, or request bodies here.
log_format playnex_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 443 ssl;
    server_name playnex.example.invalid;
    ssl_certificate /etc/playnex/tls/fullchain.pem;
    ssl_certificate_key /etc/playnex/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/playnex/apps/web/dist;
    index index.html;
    server_tokens off;
    client_max_body_size 4k;

    access_log /var/log/nginx/playnex-access.log playnex_safe;
    # Stock nginx error messages can contain full query URLs, even with safe access logs.
    # Disable request error logging here; use token-free server health/error codes.
    error_log /dev/null crit;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' wss://playnex.example.invalid; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Conservative private-beta caching: invitation pages and API responses stay private.
    add_header Cache-Control "no-store" always;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }

    location = /ws {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $playnex_connection_upgrade;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
